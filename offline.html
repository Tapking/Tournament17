<!DOCTYPE html>

<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">

```
<meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
>

<meta
    name="theme-color"
    content="#111827"

<title>بدون اتصال به اینترنت</title>

<style>
    * {
        box-sizing: border-box;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        min-height: 100%;
    }

    body {
        font-family:
            Tahoma,
            Arial,
            sans-serif;

        background:
            linear-gradient(
                135deg,
                #111827,
                #1f2937
            );

        color: #ffffff;

        min-height: 100vh;

        display: flex;

        align-items: center;

        justify-content: center;

        padding: 20px;
    }

    .offline-container {
        width: 100%;
        max-width: 500px;

        background: rgba(
            255,
            255,
            255,
            0.08
        );

        border: 1px solid rgba(
            255,
            255,
            255,
            0.12
        );

        border-radius: 24px;

        padding: 35px 25px;

        text-align: center;

        box-shadow:
            0 20px 60px
            rgba(0, 0, 0, 0.35);

        backdrop-filter: blur(12px);
    }

    .offline-icon {
        width: 100px;
        height: 100px;

        margin: 0 auto 25px;

        border-radius: 50%;

        display: flex;

        align-items: center;

        justify-content: center;

        font-size: 48px;

        background: rgba(
            255,
            255,
            255,
            0.1
        );

        border: 1px solid rgba(
            255,
            255,
            255,
            0.15
        );
    }

    h1 {
        margin: 0 0 15px;

        font-size: 28px;
    }

    p {
        margin: 0 auto 25px;

        max-width: 390px;

        line-height: 2;

        color: #d1d5db;

        font-size: 15px;
    }

    .status {
        display: inline-flex;

        align-items: center;

        gap: 8px;

        padding: 8px 14px;

        border-radius: 999px;

        background: rgba(
            239,
            68,
            68,
            0.15
        );

        color: #fca5a5;

        font-size: 13px;

        margin-bottom: 25px;
    }

    .status-dot {
        width: 8px;
        height: 8px;

        border-radius: 50%;

        background: #ef4444;
    }

    .retry-button {
        border: none;

        outline: none;

        cursor: pointer;

        padding: 13px 24px;

        border-radius: 12px;

        background: #ffffff;

        color: #111827;

        font-family: inherit;

        font-size: 15px;

        font-weight: bold;

        transition:
            transform 0.2s ease,
            opacity 0.2s ease;
    }

    .retry-button:hover {
        transform: translateY(-2px);
    }

    .retry-button:active {
        transform: translateY(0);
    }

    .hint {
        margin-top: 22px;

        font-size: 12px;

        color: #9ca3af;

        line-height: 1.8;
    }

    @media (max-width: 480px) {

        .offline-container {
            padding: 30px 20px;
        }

        .offline-icon {
            width: 85px;
            height: 85px;

            font-size: 40px;
        }

        h1 {
            font-size: 24px;
        }

        p {
            font-size: 14px;
        }
    }
</style>
```

</head>

<body>

```
<main class="offline-container">

    <div
        class="offline-icon"
        aria-hidden="true"
    >
        📡
    </div>

    <div class="status">

        <span class="status-dot"></span>

        اتصال اینترنت برقرار نیست

    </div>

    <h1>
        شما آفلاین هستید
    </h1>

    <p>
        اتصال اینترنت شما قطع شده است.
        اتصال را بررسی کنید و دوباره
        تلاش کنید.
    </p>

    <button
        class="retry-button"
        type="button"
        onclick="retryConnection()"
    >
        🔄 تلاش دوباره
    </button>

    <div class="hint">
        اگر اطلاعات مسابقات قبلاً روی همین
        دستگاه ذخیره شده باشد، بعد از
        برقراری اتصال می‌توانید دوباره
        برنامه را باز کنید.
    </div>

</main>


<script>
    function retryConnection() {

        if (navigator.onLine) {

            window.location.href =
                "index.html";

            return;
        }

        window.location.reload();
    }


    window.addEventListener(
        "online",
        function () {

            window.location.href =
                "index.html";

        }
    );
</script>
```

</body>
</html>
